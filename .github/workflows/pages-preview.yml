name: Preview dev-react on GitHub Pages

on:
  push:
    branches: [dev-react]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-react-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the preview branch
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the website
        run: npm run build
      - name: Upload the website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the preview
        id: deployment
        uses: actions/deploy-pages@v4
