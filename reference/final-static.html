{id:'industrial',zh:'工业与控制',en:'Industrial',icon:'factory',desc:['应对严苛环境与长期运行','For demanding environments'],types:['crystal','oscillator','ocxo'],body:['工业控制、测量与自动化系统需要可靠的时钟参考。选型应考虑环境温度、电源质量、器件寿命及所需的时序精度。','Industrial control, measurement and automation depend on reliable clock references. Consider temperature, power quality, lifetime and timing accuracy.']},
{id:'consumer',zh:'消费电子',en:'Consumer Electronics',icon:'mobile',desc:['小型化设计，支持日常创新','Compact timing for everyday innovation'],types:['crystal','oscillator','tcxo'],body:['便携设备与消费电子更关注尺寸、功耗和成本。结合芯片参考设计核对负载电容、封装、电压及启动条件。','Portable and consumer devices prioritize size, power and cost. Check load capacitance, package, voltage and startup conditions against the chipset reference design.']}
];
const guides=[
{id:'selection',zh:'频率控制元件选型指南',en:'Frequency Control Selection Guide',type:['选型指南','SELECTION GUIDE'],desc:['晶体、XO、VCXO、TCXO 与 OCXO 如何选择？','Choose between crystals, XO, VCXO, TCXO and OCXO.'],body:['先区分无源晶体与有源振荡器。\n无源晶体需要外部振荡电路，应核对负载电容、等效串联电阻及驱动功率。\nXO 提供集成的时钟输出，需核对供电、输出电平、负载与抖动。\nVCXO 用于电压控制频率调谐；TCXO 通过温度补偿提高稳定度；OCXO 通过恒温控制获得更高稳定度。\n最终选型以具体型号的正式规格书、测试条件和实际应用验证为准。','Distinguish passive crystals from active oscillators.\nCrystals require an external oscillator circuit: check load capacitance, ESR and drive level.\nXO devices supply integrated clock outputs: check supply, logic levels, load and jitter.\nVCXO supports voltage-controlled tuning; TCXO compensates for temperature; OCXO uses oven control.\nFinal selection requires the exact datasheet and application validation.']},
{id:'parameters',zh:'读懂晶振关键参数',en:'Understanding Timing Parameters',type:['技术文章','TECHNICAL NOTE'],desc:['频率容差、稳定度、相位噪声与抖动的基础解读。','Frequency tolerance, stability, phase noise and jitter explained.'],body:['频率容差描述器件在指定参考条件下与标称频率的偏差。\n温度稳定度描述频率在规定温度范围内的变化。\n老化率描述频率随时间的长期变化。\n相位噪声和抖动分别从频域、时域描述时钟的短期波动；比较抖动时必须核对积分带宽和测试条件。\n不同指标不能直接互相替代，总误差预算还需考虑供电、负载和使用寿命。','Frequency tolerance is the initial deviation from nominal frequency at specified conditions.\nTemperature stability describes variation across a specified temperature range.\nAging describes long-term frequency drift.\nPhase noise and jitter describe short-term variations in frequency and time domains. Compare jitter only with matching bandwidths and test conditions.\nAn error budget should also account for supply, load and lifetime.']},
{id:'bom',zh:'BOM 询价准备清单',en:'BOM Enquiry Checklist',type:['应用支持','APPLICATION SUPPORT'],desc:['一次整理型号、数量、交期及替代要求。','Prepare part numbers, quantities, lead times and alternatives.'],body:['请提供：原厂完整型号、需求数量、目标交期、应用场景。\n如需协助选型，请补充：频率、封装、供电电压、输出类型、稳定度与工作温度。\n替代选型还需核对引脚定义、启动时间、控制脚功能及负载条件。\n请勿在 BOM 中包含与询价无关的个人信息或机密。\n联系方式：taitien@simacity.com.cn / 021-62271972','Provide the full manufacturer part number, quantity, target delivery date and application.\nFor selection support, add frequency, package, supply, output type, stability and temperature range.\nFor replacements, compare pin assignments, startup timing, control pins and loading.\nExclude personal or confidential information unrelated to the enquiry.\nContact: taitien@simacity.com.cn / 021-62271972']}
];

function products(){const q=current().q,raw=q.get('category'),selected=categories.some(c=>c.id===raw)?raw:'',frequency=q.get('frequency')||'';return intro('PRODUCTS & SELECTION',t('产品与快速选型','Products & selection'),t('从应用需求出发，找到合适的频率控制方案。','Find the right frequency control technology for your design.'))+`<section class="section container">${selector(true)}<div class="filter-tabs">${[{id:'',short:t('全部产品','All products')},...categories].map(c=>`<a class="${selected===c.id?'active':''}" href="#/products?category=${c.id}&frequency=${encodeURIComponent(frequency)}">${c.short}</a>`).join('')}</div>${frequency?`<div class="notice">${icon('sliders')}<div>${t('目标频率：','Target frequency: ')}<strong>${esc(frequency)} MHz</strong><p>${t('该条件将作为选型需求传递给技术支持。具体可供型号与参数请由团队确认。','This requirement will be shared with our team. Device availability and specifications require confirmation.')}</p></div>${link('/contact?category='+selected+'&frequency='+encodeURIComponent(frequency),t('发送选型需求','Request selection'),'button secondary')}</div>`:''}${productCards(selected?[selected]:null)}<div class="info-panel">${icon('cpu')}<div><h3>${t('有完整型号或 BOM？','Already have a part number or BOM?')}</h3><p>${t('发送型号、数量及交期，由团队确认规格与供货情况。','Send part numbers, quantities and delivery requirements for confirmation.')}</p></div>${link('/contact?subject=BOM',t('提交询价','Send enquiry'))}</div></section>`}
function productDetail(id){const c=categories.find(x=>x.id===id);if(!c)return notFound();return intro(c.short+' / FREQUENCY CONTROL',t(c.zh,c.en),t(...c.desc))+`<section class="section container product-detail"><div class="detail-illustration">${crystal()}<small>${t('封装示意，非具体型号实物图','Package illustration, not a specific device')}</small></div><div><p class="eyebrow">SELECTION PARAMETERS</p><h2>${t('选型关注点','Key selection parameters')}</h2><div class="parameter-table">${c.params.map((p,i)=>`<div><span>0${i+1}</span><strong>${t(p,c.ep[i])}</strong><span>${t('按项目需求确认','Confirm for your design')}</span></div>`).join('')}</div><p class="muted">${t('规格、封装和可供型号需根据项目要求核实。联系我们获取对应型号的正式资料与报价。','Specifications, packages and available devices must be verified for your project. Contact us for official documentation and a quotation.')}</p><div class="action-row">${link('/contact?category='+c.id,t('咨询此类产品','Enquire about this product'),'button primary','up')}${link('/resources/selection',t('阅读选型指南','Read selection guide'),'button secondary','')}</div></div></section><div class="container">${bomBanner()}</div>`}
function applicationPage(id){if(!id)return intro('APPLICATIONS',t('以精准时钟，支持多元应用','Timing for a connected world'),t('围绕实际工作条件，选择适合您的频率控制方案。','Select frequency control solutions around real operating conditions.'))+`<section class="section container">${applicationCards()}</section><div class="container">${bomBanner()}</div>`;const a=applications.find(x=>x.id===id);if(!a)return notFound();return intro('APPLICATION INSIGHT',t(a.zh,a.en),t(...a.desc))+`<section class="section container"><div class="application-story">${icon(a.icon)}<div><h2>${t('从应用条件出发','Start with the application')}</h2><p>${t(...a.body)}</p></div></div>${heading('EXPLORE TECHNOLOGIES',t('了解相关产品类别','Explore relevant technologies'))}${productCards(a.types)}</section><div class="container">${bomBanner()}</div>`}
function resources(id){if(!id)return intro('TECHNICAL RESOURCES',t('技术资源中心','Technical resources'),t('理解参数、梳理需求，让每一次选型更清晰。','Understand specifications and make every selection clearer.'))+`<section class="section container">${resourceCards()}<div class="info-panel">${icon('file')}<div><h3>${t('需要型号规格书？','Need a device datasheet?')}</h3><p>${t('提供完整型号，我们将协助获取对应版本的正式资料。','Share the complete part number for the right documentation.')}</p></div>${link('/contact?subject=datasheet',t('申请规格书','Request datasheet'),'button secondary')}</div><p class="muted">${t('本站指南由 Simacity 整理，仅供基础选型参考；具体设计以型号正式规格书为准。','These Simacity guides provide general selection support. Use official device specifications for design decisions.')}</p></section>`;const g=guides.find(x=>x.id===id);if(!g)return notFound();return intro('SIMACITY TECHNICAL GUIDE',t(g.zh,g.en),t(...g.desc))+`<section class="section container article-layout"><article><p class="article-meta">SIMACITY · ${t('技术参考 / 中文','Technical reference / English')}</p>${t(...g.body).split('\n').map(p=>`<p>${esc(p)}</p>`).join('')}<div class="notice">${t('本站整理的基础技术参考，不替代具体型号的正式规格书。','General technical guidance, not a replacement for official device documentation.')}</div></article><aside>${icon('file')}<h3>${t('保存这份参考','Keep this reference')}</h3><p>${t('下载 Markdown 文本，便于项目沟通与需求整理。','Download a Markdown copy for project discussions and requirements.')}</p><button class="button primary" data-action="download" data-guide="${g.id}">${icon('download')}${t('下载指南 · MD','Download guide · MD')}</button>${link('/contact',t('咨询技术支持','Contact support'))}</aside></section>`}
function about(){return intro('ABOUT SIMACITY',t('连接产品与您的设计','Connecting products with your design'),t('专注频率控制元件的选型沟通与采购支持。','Focused on frequency control selection and sourcing support.'))+`<section class="section container about-layout"><div><p class="eyebrow">SIMACITY × TAITIEN</p><h2>${t('从技术需求，到采购对接','From technical requirements to sourcing')}</h2><p>${t('Simacity 为 Taitien 频率控制产品提供选型与供货沟通支持。我们围绕频率、封装、稳定度、工作环境和交期，协助客户整理需求并确认合适的产品方向。','Simacity supports the selection and sourcing of Taitien frequency control products. We help clarify frequency, package, stability, operating conditions and delivery requirements.')}</p><p>${t('本网站由 Simacity 独立运营。产品资料、供货情况及具体服务范围，请与我们的团队确认。','This website is independently operated by Simacity. Contact our team to confirm product documentation, availability and services.')}</p>${link('/contact',t('与我们联系','Get in touch'),'button primary')}</div><div class="service-stack">${[['cpu','选型沟通','Selection support'],['file','BOM 需求整理','BOM coordination'],['chat','持续项目对接','Project communication']].map(([i,zh,en],n)=>`<div>${icon(i)}<strong>${t(zh,en)}</strong><span>0${n+1}</span></div>`).join('')}</div></section>`}
function enquiryContent(){if(prepared){const text=prepared.body,mail='mailto:taitien@simacity.com.cn?subject='+encodeURIComponent(prepared.subject)+'&body='+encodeURIComponent(text);return `<div class="prepared" role="status">${icon('check')}<h3>${t('询价内容已整理','Your enquiry is prepared')}</h3><p>${t('尚未发送。点击下方按钮打开邮件应用，确认后发送。','Not sent yet. Open your email application below, review and send.')}</p>${bomFile?`<div class="notice">${t('请在邮件中手动添加附件：','Please attach this file manually in your email: ')}${esc(bomFile.name)}</div>`:''}<textarea id="prepared-body" readonly aria-label="${t('询价邮件内容','Enquiry email content')}">${esc(text)}</textarea><div class="action-row"><a class="button primary" href="${esc(mail)}">${icon('mail')}${t('打开邮件应用','Open email app')}</a><button class="button secondary" data-action="copy">${t('复制内容','Copy content')}</button></div><button class="text-link" data-action="edit-enquiry">${t('修改需求','Edit enquiry')}</button></div>`}const field=(name,zh,en,type='text',required=false,auto='off')=>`<label>${t(zh,en)}${required?' *':''}<input name="${name}" type="${type}"${required?' required':''} autocomplete="${auto}" maxlength="120" value="${esc(contactDraft[name]||'')}"></label>`;return `<form class="enquiry-form" data-form="enquiry"><div class="form-grid">${field('name','您的姓名','Your name','text',true,'name')}${field('company','公司名称','Company','text',false,'organization')}${field('email','联系邮箱','Email','email',true,'email')}${field('phone','联系电话','Phone','tel',false,'tel')}</div><label>${t('型号与需求说明','Part numbers & requirements')} *<textarea name="message" required rows="5" maxlength="1800" placeholder="${t('请填写型号、数量、目标交期，或频率、封装等选型条件。','Include part numbers, quantities and delivery date, or frequency and package requirements.')}">${esc(contactDraft.message||'')}</textarea></label><label class="file-upload">${icon('upload')}<span><span id="file-name">${esc(bomFile?.name||t('选择 BOM 文件（邮件中需手动附上）','Choose a BOM file (attach manually in email)'))}</span><small>XLSX / XLS / CSV / PDF / TXT · ${t('最大 10 MB','Up to 10 MB')}</small></span><input type="file" name="bom" accept=".xlsx,.xls,.csv,.pdf,.txt" aria-label="BOM file"></label><p class="form-note">${t('此表单不上传或保存文件；BOM 需在邮件应用中手动添加。','This form does not upload or store files. Attach your BOM in your email application.')}</p><p id="file-error" class="form-error" role="alert" hidden></p><button class="button primary" type="submit">${t('生成询价邮件','Prepare enquiry email')}${icon('arrow')}</button></form>`}
function contact(){const q=current().q,key=q.toString();if(contactRoute!==key){contactRoute=key;prepared=null;const c=categories.find(c=>c.id===q.get('category'));contactDraft.message=[c?'Product: '+c.short:'',q.get('frequency')?'Frequency: '+q.get('frequency')+' MHz':'',q.get('subject')==='datasheet'?'Datasheet request':''].filter(Boolean).join('\n')}return intro('CONTACT & ENQUIRY',t('一起找到合适的方案','Let’s find your solution'),t('告诉我们您的型号、应用或选型需求。','Tell us about your part numbers, application or selection requirements.'))+`<section class="section container contact-layout"><div><h2>${t('联系我们','Contact us')}</h2>${contactInfo()}<div class="contact-qr">${qr()}<div><h3>${t('扫一扫添加企业微信','Add us on WeCom')}</h3><p>${t('直接与我们的团队沟通','Connect directly with our team')}</p></div></div></div><div class="enquiry-panel"><p class="eyebrow">BOM & TECHNICAL SUPPORT</p><h2>${t('发送您的需求','Prepare your enquiry')}</h2><p class="muted">${t('填写后生成询价邮件，由您的邮件应用发送。','Complete the form to prepare a message in your email application.')}</p><div id="enquiry-content">${enquiryContent()}</div></div></section>`}
function searchPage(){const q=(current().q.get('q')||'').trim(),matches=s=>q&&s.toLowerCase().includes(q.toLowerCase()),cs=categories.filter(c=>matches([c.zh,c.en,c.short,c.brief,...c.desc].join(' '))),gs=guides.filter(g=>matches([g.zh,g.en,...g.desc].join(' ')));return intro('SITE SEARCH',t('站内搜索','Site search'),q?t(`“${q}” 的搜索结果`,`Search results for “${q}”`):t('输入产品类别、技术关键词或资料名称。','Enter a product category or technical topic.'))+`<section class="section container"><form class="large-search" data-form="search">${icon('search')}<input name="q" value="${esc(q)}" required aria-label="${t('搜索关键词','Search terms')}" placeholder="${t('例如 TCXO、晶体、选型','Try TCXO, crystal or selection')}"><button class="button primary">${t('搜索','Search')}</button></form><p class="muted">${t(`找到 ${cs.length+gs.length} 项内容`,`Found ${cs.length+gs.length} results`)}</p><div class="search-results">${cs.map(c=>`<a href="#/products/${c.id}">${icon('cpu')}<div><h3>${t(c.zh,c.en)} · ${c.short}</h3><p>${t(...c.desc)}</p></div>${icon('arrow')}</a>`).join('')}${gs.map(g=>`<a href="#/resources/${g.id}">${icon('file')}<div><h3>${t(g.zh,g.en)}</h3><p>${t(...g.desc)}</p></div>${icon('arrow')}</a>`).join('')}</div>${cs.length+gs.length===0?`<div class="empty-state">${icon('search')}<h2>${t('暂未找到匹配内容','No matching content yet')}</h2><p>${t('可尝试晶体、XO、TCXO 等关键词。具体型号请联系团队确认。','Try crystal, XO or TCXO. For specific part numbers, contact our team.')}</p>${link('/contact',t('获取选型支持','Get selection support'),'button secondary','')}</div>`:''}</section>`}
function notFound(){return `<section class="section container empty-state"><p class="eyebrow">404</p><h1>${t('页面未找到','Page not found')}</h1><p>${t('您可以返回首页，或浏览产品与技术资源。','Return home or explore our products and technical resources.')}</p>${link('/',t('返回首页','Back to home'),'button primary')}</section>`}
function render(){const{path}=current();const parts=path.split('/').filter(Boolean);let html;if(!parts.length)html=home();else if(parts.length>2)html=notFound();else switch(parts[0]){case'products':html=parts[1]?productDetail(parts[1]):products();break;case'applications':html=applicationPage(parts[1]);break;case'resources':html=resources(parts[1]);break;case'about':html=parts.length===1?about():notFound();break;case'contact':html=parts.length===1?contact():notFound();break;case'search':html=parts.length===1?searchPage():notFound();break;default:html=notFound()}
 document.documentElement.lang=lang==='zh'?'zh-CN':'en';$('#header').innerHTML=header();$('#main').innerHTML=html;$('#footer').innerHTML=footer();$('#floating').innerHTML=floating();document.title=($('#main h1')?.textContent||'Simacity')+' | Simacity × Taitien';}
function setPopover(open,restore=false){const panel=$('#contact-popover'),button=$('.floating-button');panel.hidden=!open;button.setAttribute('aria-expanded',String(open));button.innerHTML=icon(open?'x':'chat')+`<span>${t('联系顾问','Contact us')}</span>`;if(open)panel.querySelector('.popover-close').focus();else if(restore)button.focus()}
function closeMenu(){const header=$('.site-header');header.classList.remove('menu-open');const b=$('.menu-toggle');b.setAttribute('aria-expanded','false');b.innerHTML=icon('menu')}
function captureDrafts(){const sf=$('[data-form="selector"]');if(sf)selectorDraft=Object.fromEntries(new FormData(sf));const cf=$('[data-form="enquiry"]');if(cf){const data=new FormData(cf);for(const key of ['name','company','email','phone','message'])contactDraft[key]=String(data.get(key)||'')}searchDraft=$('.search-form input')?.value||searchDraft}
function toast(message){clearTimeout(toastTimer);const el=$('#toast');el.textContent=message;el.hidden=false;toastTimer=setTimeout(()=>el.hidden=true,3500)}
function downloadGuide(id){const g=guides.find(g=>g.id===id);if(!g)return;const content='# '+t(g.zh,g.en)+'\n\nSimacity · '+t('技术参考资料','Technical reference')+'\n\n'+t(...g.body)+'\n\n'+t('本文由 Simacity 整理，不替代型号正式规格书。','Prepared by Simacity. This guide does not replace official device specifications.');const url=URL.createObjectURL(new Blob([content],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='simacity-'+id+'.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function copyEnquiry(){const text=prepared?.body||'';try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(text);toast(t('询价内容已复制','Enquiry copied'))}catch(e){const area=$('#prepared-body');area.focus();area.select();try{if(!document.execCommand('copy'))throw Error();toast(t('询价内容已复制','Enquiry copied'))}catch(err){toast(t('内容已选中，请手动复制','Text selected. Please copy it manually.'))}}}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(button){const action=button.dataset.action;if(action==='skip'){event.preventDefault();$('#main').focus();return}if(action==='language'){captureDrafts();lang=lang==='zh'?'en':'zh';try{localStorage.setItem('simacity-language',lang)}catch(e){}render();return}if(action==='menu'){const open=$('.site-header').classList.toggle('menu-open');button.setAttribute('aria-expanded',String(open));button.innerHTML=icon(open?'x':'menu');return}if(action==='contact'){setPopover($('#contact-popover').hidden);return}if(action==='close-contact'){setPopover(false,true);return}if(action==='download'){downloadGuide(button.dataset.guide);return}if(action==='copy'){copyEnquiry();return}if(action==='edit-enquiry'){prepared=null;$('#enquiry-content').innerHTML=enquiryContent();return}}
 if(!event.target.closest('.floating-contact')&&!$('#contact-popover').hidden)setPopover(false);if(event.target.closest('a[href^="#/"]')){captureDrafts();setPopover(false);closeMenu()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(!$('#contact-popover').hidden)setPopover(false,true);else if($('.site-header').classList.contains('menu-open')){closeMenu();$('.menu-toggle').focus()}}});
document.addEventListener('submit',event=>{const form=event.target;if(!form.dataset.form)return;event.preventDefault();const data=new FormData(form);if(form.dataset.form==='search'){searchDraft=String(data.get('q')||'').trim();navigate('/search?q='+encodeURIComponent(searchDraft));return}if(form.dataset.form==='selector'){selectorDraft=null;navigate('/products?category='+encodeURIComponent(String(data.get('category')||''))+'&frequency='+encodeURIComponent(String(data.get('frequency')||'')));return}if(form.dataset.form==='enquiry'){captureDrafts();const body=[`Contact: ${contactDraft.name}`,`Company: ${contactDraft.company||''}`,`Email: ${contactDraft.email}`,`Phone: ${contactDraft.phone||''}`,`\nRequirements:\n${contactDraft.message}`,bomFile?`\nBOM: ${bomFile.name} (${t('请手动添加附件','Please attach this file manually')})`:''].filter(Boolean).join('\n');prepared={body,subject:'Taitien / Simacity '+(current().q.get('subject')==='BOM'?'BOM ':'')+'Enquiry'};$('#enquiry-content').innerHTML=enquiryContent()}});
document.addEventListener('change',event=>{const input=event.target;if(!input.matches('input[type=file][name=bom]'))return;const file=input.files?.[0],error=$('#file-error');input.setCustomValidity('');error.hidden=true;if(file&&(file.size>10*1024*1024||! /\.(xlsx|xls|csv|pdf|txt)$/i.test(file.name))){bomFile=null;input.value='';error.textContent=t('请使用不超过 10 MB 的 XLSX、XLS、CSV、PDF 或 TXT 文件。','Use an XLSX, XLS, CSV, PDF or TXT file up to 10 MB.');error.hidden=false}else bomFile=file||null;$('#file-name').textContent=bomFile?.name||t('选择 BOM 文件（邮件中需手动附上）','Choose a BOM file (attach manually in email)')});
window.addEventListener('hashchange',()=>{selectorDraft=null;render();window.scrollTo(0,0)});

render();
</script>
</body>
</html>
